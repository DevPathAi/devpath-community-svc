name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  build:
    runs-on: ubuntu-latest
    # 매달림을 53분 침묵 대신 실패로 바꾼다. 정상 소요는 2~5분이고, Flyway 자기 교착
    # (application-test.yml 의 transactional-lock 주석 참조)이 여기서 실제로 53분을 삼켰다.
    timeout-minutes: 15
    permissions:
      contents: read
      packages: read
    services:
      postgres:
        image: pgvector/pgvector:pg17
        env:
          POSTGRES_USER: devpath
          POSTGRES_PASSWORD: localdev
          POSTGRES_DB: devpath
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    steps:
      - uses: actions/checkout@v6

      # 커뮤니티 검색 통합 테스트용 Elasticsearch(+nori 한국어 형태소 분석기).
      #
      # services: 가 아니라 step 에서 직접 빌드·기동한다. 공식 이미지에는 nori 가 없고
      # services: 는 컨테이너 안에서 명령을 실행할 수 없어 자체 이미지가 필요한데,
      # GHCR 사설 이미지를 쓰려면 패키지를 레포에 연결하거나 public 으로 열어야 한다
      # (GITHUB_TOKEN 은 워크플로가 도는 레포에 연결·허용된 패키지만 읽는다). 조직 정책상
      # public 전환이 막혀 있어, 외부 설정에 의존하지 않는 이 방식을 택했다.
      # 대가는 이미지 빌드 시간이고, 얻는 것은 재현성이다 — 레지스트리 권한 상태와 무관하게
      # 누구나 같은 결과를 얻는다.
      #
      # 테스트는 application-test.yml 의 ES_URIS 기본값(localhost:9200)으로 접속한다.
      - name: Start Elasticsearch (nori)
        run: |
          docker build -t devpath-es:ci docker/elasticsearch
          docker run -d --name devpath-es -p 9200:9200 \
            -e discovery.type=single-node \
            -e xpack.security.enabled=false \
            -e ES_JAVA_OPTS="-Xms512m -Xmx512m" \
            devpath-es:ci
          # health-cmd 대신 명시적 폴링 — 실패 시 컨테이너 로그를 남겨야 원인이 보인다.
          for i in $(seq 1 60); do
            if curl -sf http://localhost:9200 > /dev/null; then
              echo "Elasticsearch ready after ${i} attempt(s)"
              curl -s http://localhost:9200/_cat/plugins
              exit 0
            fi
            sleep 3
          done
          echo "::error::Elasticsearch 가 180초 안에 기동하지 않았다"
          docker logs devpath-es
          exit 1

      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: 21
      - uses: gradle/actions/setup-gradle@v6
      - run: ./gradlew build
        env:
          DB_URL: jdbc:postgresql://localhost:5432/devpath
          DB_USER: devpath
          DB_PASSWORD: localdev
          GITHUB_ACTOR: ${{ github.actor }}
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  image:
    needs: build
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: 21
      - uses: gradle/actions/setup-gradle@v6
      - run: ./gradlew bootJar
        env:
          GITHUB_ACTOR: ${{ github.actor }}
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      - uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - uses: docker/build-push-action@v7
        with:
          context: .
          push: true
          tags: |
            ghcr.io/devpathai/devpath-community-svc:${{ github.sha }}
            ghcr.io/devpathai/devpath-community-svc:main

  deploy:
    needs: image
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/create-github-app-token@v3
        id: app-token
        with:
          app-id: ${{ secrets.GITOPS_APP_ID }}
          private-key: ${{ secrets.GITOPS_APP_PRIVATE_KEY }}
          owner: DevPathAi
          repositories: devpath-gitops
      - uses: actions/checkout@v6
        with:
          repository: DevPathAi/devpath-gitops
          token: ${{ steps.app-token.outputs.token }}
          path: gitops
      - name: Install kustomize
        run: |
          curl -sLo kustomize.tar.gz https://github.com/kubernetes-sigs/kustomize/releases/download/kustomize%2Fv5.4.3/kustomize_v5.4.3_linux_amd64.tar.gz
          tar -xzf kustomize.tar.gz && sudo mv kustomize /usr/local/bin/
      - name: set image to commit SHA
        working-directory: gitops/apps/devpath-community-svc/base
        run: kustomize edit set image ghcr.io/devpathai/devpath-community-svc=ghcr.io/devpathai/devpath-community-svc:${{ github.sha }}
      - name: commit & push
        working-directory: gitops
        run: |
          git config user.name "devpath-gitops-bot[bot]"
          git config user.email "devpath-gitops-bot[bot]@users.noreply.github.com"
          git add -A
          git diff --cached --quiet && echo "no change" && exit 0
          git commit -m "deploy(devpath-community-svc): ${{ github.sha }}"
          for i in 1 2 3; do git push && break || (git pull --rebase && sleep 2); done
